name: CSS lint

on:
  push:
    branches:
      - ui-polish-preserve-layout
  pull_request:
    branches:
      - ui-polish-preserve-layout

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Stylelint
        run: npx --yes stylelint@18.0.0 --config .stylelintrc.json "app/**/*.css" "static/**/*.css"
