
services:
  db:
    image: postgres:18
    container_name: startup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: startup_db
      POSTGRES_USER: startup_user
      POSTGRES_PASSWORD: startup_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
